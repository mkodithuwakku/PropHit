<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0e11" />
    <title>Prophit — Daily NBA Prop Slate</title>
    <link rel="stylesheet" href="styles.css?v=picks-3" />
  </head>
  <body>
    <div class="app">
      <header class="slate-header">
        <div class="header-row">
          <h1>PROPHIT</h1>
          <span id="slate-date" class="slate-date"></span>
        </div>
        <div id="model-record" class="model-record" hidden></div>
        <div id="demo-badge" class="demo-badge" hidden>DEMO DATA</div>
      </header>

      <div class="controls">
        <nav class="view-tabs" id="view-tabs" aria-label="Views">
          <button data-view="browse" class="view-tab active">Browse</button>
          <button data-view="digest" class="view-tab">Best Picks</button>
          <button data-view="games" class="view-tab">Games</button>
        </nav>

        <div id="browse-controls" class="browse-controls">
          <div class="game-picker" id="game-picker">
            <button id="game-picker-btn" class="game-picker-btn" type="button">
              <span id="game-picker-label">All games</span>
              <span id="game-picker-clear" class="game-picker-clear" hidden>✕</span>
              <span class="game-picker-caret">▾</span>
            </button>
            <div id="game-picker-list" class="game-picker-list" hidden></div>
          </div>
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Search player or team…"
              autocomplete="off"
            />
          </div>
          <nav class="filter-tabs" id="filter-tabs" aria-label="Play filters">
            <button data-filter="value" class="tab active"></button>
            <button data-filter="milestones" class="tab"></button>
            <button data-filter="overs" class="tab"></button>
            <button data-filter="unders" class="tab"></button>
            <button data-filter="all" class="tab"></button>
          </nav>
          <nav class="stat-tabs" id="stat-tabs" aria-label="Stat filters"></nav>
          <div class="results-meta">
            <span id="results-count"></span>
            <select id="sort-select" aria-label="Sort plays">
              <option value="ev">Sort: EV</option>
              <option value="prob">Sort: Probability</option>
              <option value="edge">Sort: Edge</option>
              <option value="name">Sort: Player</option>
            </select>
          </div>
        </div>

        <div id="digest-sort" class="digest-sort" hidden>
          <button data-dsort="ev" class="tab active">EV</button>
          <button data-dsort="prob" class="tab">Prob</button>
        </div>
        <p id="digest-note" class="digest-note" hidden>0.5 lines are excluded from Best Picks. Find them in Browse.</p>
      </div>

      <main id="plays" class="plays" aria-live="polite"></main>
      <div class="load-more-wrap">
        <button id="load-more" class="load-more" hidden>Show more</button>
      </div>

      <footer class="slate-footer">
        <span id="generated-at"></span>
      </footer>
    </div>

    <script src="app.js?v=picks-3"></script>
  </body>
</html>
